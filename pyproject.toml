[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jiaowu-crawler"
version = "0.1.0"
description = "BJUT jwglxt timetable crawler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright==1.53.0",
  "python-dotenv==1.0.1"
]

[project.optional-dependencies]
rag = [
  "fastembed==0.8.0",
  "chromadb==1.5.9",
  "numpy>=1.26,<3"
]
backend = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.28,<1",
  "langchain==1.4.2",
  "langchain-openai==1.6.0",
  "langgraph-checkpoint-sqlite==3.1.1",
  "fastembed==0.8.0",
  "chromadb==1.5.9",
  "numpy>=1.26,<3"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jiaowu_rag = ["static/*"]
